<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 20 184 184" width="512" height="512">
  <!--
    Иконка приложения на домашнем экране.

    ИСХОДНИК, А НЕ КОПИЯ. Фигура взята из `src/ui/osya.ts` — те же пути, те же
    цвета, только заливки проставлены прямо в теге: иконку рендерит не браузер
    с нашим CSS, а системный просмотрщик.

    Отличия от фигуры в приложении, и оба намеренные:
      * рук нет. На 60 px они превращаются в две палки поперёк лица;
      * фон непрозрачный и во весь квадрат. iOS скругляет углы сам, а под
        прозрачностью показывает чёрное.

    Права: нарисовано в коде проекта, чужого нет. Это и отличает иконку от
    `bg.jpg` и `hand.png`, которые в git не идут.

    Пересобрать PNG (iOS берёт растр, SVG в apple-touch-icon не умеет):
      cd app/public
      qlmanage -t -s 512 -o . icon.svg
      sips -z 180 180 icon.svg.png
      mv icon.svg.png apple-touch-icon.png

    Имя выходного файла именно такое: iOS запрашивает apple-touch-icon.png с
    корня сайта сам, по соглашению, даже если до тега в разметке дело не
    дошло. С произвольным именем ярлык на телефоне остался серым квадратом.

    Почему через 512, а не сразу 180: qlmanage рендерит содержимое в его
    СОБСТВЕННОМ размере и вписывает в холст «-s», оставляя поля. Совпадут
    width/height файла и «-s» — поля исчезнут. Отсюда 512 в теге выше, и
    отсюда же уменьшение вторым шагом.

    И ещё одно, найденное тем же способом: в комментарии XML нельзя two
    hyphens подряд. Строка с ними ломает разбор целиком, а qlmanage вместо
    иконки молча кладёт картинку с текстом ошибки.
  -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2aa3ad"/>
      <stop offset="45%" stop-color="#157d92"/>
      <stop offset="100%" stop-color="#0d5c78"/>
    </linearGradient>
  </defs>

  <rect x="18" y="20" width="184" height="184" fill="url(#water)"/>

  <!-- Щупальца: те же кривые, что в фигуре Оси. -->
  <g fill="none" stroke="#8f7ac2" stroke-width="17" stroke-linecap="round">
    <path d="M 58 130 C 44 152 46 174 34 184"/>
    <path d="M 80 140 C 70 162 72 182 60 190"/>
    <path d="M 100 143 C 96 166 98 186 88 196"/>
    <path d="M 122 143 C 126 166 124 186 134 196"/>
    <path d="M 142 140 C 152 162 150 182 162 190"/>
    <path d="M 162 130 C 176 152 174 174 186 184"/>
  </g>

  <ellipse cx="110" cy="88" rx="66" ry="60" fill="#8f7ac2"/>

  <ellipse cx="88" cy="82" rx="15" ry="17" fill="#fff"/>
  <ellipse cx="132" cy="82" rx="15" ry="17" fill="#fff"/>
  <circle cx="90" cy="84" r="7" fill="#2a2440"/>
  <circle cx="134" cy="84" r="7" fill="#2a2440"/>

  <path d="M 94 114 Q 110 128 126 114" fill="none" stroke="#2a2440"
        stroke-width="5" stroke-linecap="round"/>
</svg>
